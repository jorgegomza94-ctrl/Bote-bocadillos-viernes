<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bote de los viernes</title>
<link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;Bote%20de%20los%20viernes&quot;,&quot;short_name&quot;:&quot;Bote%20viernes&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%23f3f4f6&quot;,&quot;theme_color&quot;:&quot;%23111827&quot;}" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Bote viernes" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f3f4f6;
    color: #1f2937;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { font-size: 13px; color: #6b7280; margin: 0 0 16px; }
  .error { background: #fef2f2; color: #b91c1c; font-size: 13px; border-radius: 10px; padding: 8px 10px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; }
  input, select {
    font-size: 14px; padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 10px; background: white; width: 100%;
  }
  button {
    font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 10px; border: none; cursor: pointer; white-space: nowrap;
  }
  .btn-add { background: #d97706; color: white; }
  .btn-in { background: #16a34a; color: white; }
  .btn-pay { background: #1f2937; color: white; }
  .btn-del { background: none; color: #9ca3af; font-size: 13px; padding: 2px 6px; }
  .total-box {
    background: #1f2937; color: white; border-radius: 14px; padding: 16px; text-align: center; margin: 16px 0;
  }
  .total-box .lbl { font-size: 12px; color: #d1d5db; margin-bottom: 4px; }
  .total-box .amt { font-size: 28px; font-weight: 700; }
  .card { border: 1px solid #e5e7eb; background: white; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .card.green { border-color: #86efac; background: #f0fdf4; }
  .card.amber { border-color: #fcd34d; background: #fffbeb; }
  .card h3 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip {
    font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid #d1d5db; background: white; color: #4b5563; cursor: pointer;
  }
  .chip.on { background: #d97706; color: white; border-color: #d97706; }
  .persona-row {
    display: flex; justify-content: space-between; align-items: center; border: 1px solid #e5e7eb; background: white; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
  }
  .persona-row.aviso { border-color: #fca5a5; background: #fef2f2; }
  .persona-row .nombre { font-weight: 500; }
  .persona-row .right { display: flex; align-items: center; gap: 8px; }
  .saldo { font-weight: 700; font-size: 14px; }
  .saldo.ok { color: #16a34a; }
  .saldo.bad { color: #dc2626; }
  .aviso-txt { font-size: 10px; color: #dc2626; font-weight: 600; }
  .hist-item { font-size: 12px; background: white; border: 1px solid #e5e7eb; border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
  .hist-item .top { display: flex; justify-content: space-between; }
  .hist-item .pos { color: #16a34a; font-weight: 600; }
  .hist-item .neg { color: #dc2626; font-weight: 600; }
  .hist-item .fecha { color: #9ca3af; }
  .hist-item .det { color: #6b7280; margin-top: 2px; }
  .empty { text-align: center; color: #9ca3af; font-size: 13px; padding: 24px 0; }
  .section-title { font-size: 13px; font-weight: 600; margin: 0 0 8px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const APORTE = 10;
const UMBRAL_AVISO = 2.5;

function load(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch (e) {
    return fallback;
  }
}
function save(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

let personas = load("bote-personas", []);
let historial = load("bote-historial", []);
let asistentes = {};

function registrarMovimiento(mov) {
  historial = [{ ...mov, fecha: new Date().toISOString() }, ...historial].slice(0, 50);
  save("bote-historial", historial);
}

function añadirPersona() {
  const input = document.getElementById("nuevoNombre");
  const nombre = input.value.trim();
  if (!nombre) return;
  if (personas.some(p => p.nombre.toLowerCase() === nombre.toLowerCase())) {
    mostrarError("Ya existe esa persona.");
    return;
  }
  personas.push({ nombre, saldo: 0 });
  save("bote-personas", personas);
  input.value = "";
  render();
}

function eliminarPersona(nombre) {
  personas = personas.filter(p => p.nombre !== nombre);
  save("bote-personas", personas);
  render();
}

function toggleAsistente(nombre) {
  asistentes[nombre] = !asistentes[nombre];
  render();
}

function ingresarSaldoManual() {
  const persona = document.getElementById("personaIngreso").value;
  const importe = parseFloat(document.getElementById("importeIngreso").value);
  if (!persona) { mostrarError("Elige a quién se le ingresa el saldo."); return; }
  if (isNaN(importe) || importe <= 0) { mostrarError("Introduce un importe válido."); return; }
  personas = personas.map(p => p.nombre === persona ? { ...p, saldo: p.saldo + importe } : p);
  save("bote-personas", personas);
  registrarMovimiento({ tipo: "ingreso", personas: [persona], total: importe, detalle: "Ingreso manual" });
  render();
}

function registrarCuenta() {
  const total = parseFloat(document.getElementById("totalCuenta").value);
  const seleccionados = personas.map(p => p.nombre).filter(n => asistentes[n]);
  if (isNaN(total) || total <= 0) { mostrarError("Introduce el importe total de la cuenta."); return; }
  if (seleccionados.length === 0) { mostrarError("Marca quiénes habéis estado esta vez."); return; }
  const parte = total / seleccionados.length;
  personas = personas.map(p => seleccionados.includes(p.nombre) ? { ...p, saldo: p.saldo - parte } : p);
  save("bote-personas", personas);
  registrarMovimiento({ tipo: "gasto", personas: seleccionados, total, detalle: `${parte.toFixed(2)}€ por persona` });
  asistentes = {};
  render();
}

let errorMsg = "";
function mostrarError(msg) {
  errorMsg = msg;
  render();
  setTimeout(() => { errorMsg = ""; render(); }, 3000);
}

function fmtFecha(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit" }) + " " +
         d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
}

function render() {
  const app = document.getElementById("app");
  const totalBote = personas.reduce((s, p) => s + p.saldo, 0);

  app.innerHTML = `
    <h1>🍻 Bote de los viernes</h1>
    <p class="sub">Ingresa saldo, marca quién va y reparte la cuenta. Avisa si a alguien le queda menos de ${UMBRAL_AVISO.toFixed(2)}€.</p>
    ${errorMsg ? `<div class="error">${errorMsg}</div>` : ""}

    <div class="row" style="margin-bottom:16px;">
      <input id="nuevoNombre" placeholder="Nombre del compañero" />
      <button class="btn-add" onclick="añadirPersona()">Añadir</button>
    </div>

    ${personas.length > 0 ? `
      <div class="total-box">
        <div class="lbl">Total del bote</div>
        <div class="amt">${totalBote.toFixed(2)}€</div>
      </div>
    ` : `<p class="empty">Añade a los compañeros para empezar.</p>`}

    ${personas.length > 0 ? `
      <div class="card green">
        <h3>Ingresar saldo</h3>
        <div class="row">
          <select id="personaIngreso">
            <option value="">Elegir persona</option>
            ${personas.map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join("")}
          </select>
          <input id="importeIngreso" type="number" step="0.01" placeholder="€" style="max-width:80px;" />
          <button class="btn-in" onclick="ingresarSaldoManual()">Ingresar</button>
        </div>
      </div>

      <div class="card amber">
        <h3>Pagar (quién va y total)</h3>
        <div class="chips">
          ${personas.map(p => `<span class="chip ${asistentes[p.nombre] ? "on" : ""}" onclick="toggleAsistente('${p.nombre}')">${p.nombre}</span>`).join("")}
        </div>
        <div class="row">
          <input id="totalCuenta" type="number" step="0.01" placeholder="Total de la cuenta (€)" />
          <button class="btn-pay" onclick="registrarCuenta()">Repartir</button>
        </div>
      </div>

      <p class="section-title">Saldo de cada uno</p>
      ${personas.map(p => {
        const avisar = p.saldo < UMBRAL_AVISO;
        return `
          <div class="persona-row ${avisar ? "aviso" : ""}">
            <span class="nombre">${p.nombre}</span>
            <span class="right">
              <span class="saldo ${avisar ? "bad" : "ok"}">${p.saldo.toFixed(2)}€</span>
              ${avisar ? `<span class="aviso-txt">¡Añadir saldo!</span>` : ""}
              <button class="btn-del" onclick="eliminarPersona('${p.nombre}')">✕</button>
            </span>
          </div>
        `;
      }).join("")}
    ` : ""}

    ${historial.length > 0 ? `
      <p class="section-title">Historial</p>
      <div>
        ${historial.map(h => `
          <div class="hist-item">
            <div class="top">
              <span class="${h.tipo === "ingreso" ? "pos" : "neg"}">${h.tipo === "ingreso" ? "+" : "−"} ${h.total.toFixed(2)}€</span>
              <span class="fecha">${fmtFecha(h.fecha)}</span>
            </div>
            <div class="det">${h.personas.join(", ")} · ${h.detalle}</div>
          </div>
        `).join("")}
      </div>
    ` : ""}
  `;

  const inputNombre = document.getElementById("nuevoNombre");
  if (inputNombre) {
    inputNombre.addEventListener("keydown", e => { if (e.key === "Enter") añadirPersona(); });
  }
}

render();
</script>
</body>
</html>
